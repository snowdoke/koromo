<!-- layout flex -->
<!-- 親の幅に応じて折り返す汎用Flexレイアウト。項目の幅・余白・揃え方を調整できます。 -->
<div class="p0005-layout">
  <article class="p0005-demo">
    <h3>01. 幅に合わせて折り返す</h3>
    <p>親の幅に収まるように折り返し、各行の項目が余った幅に広がります。</p>
  </article>
  <article class="p0005-demo">
    <h3>02. 内容を自由に入れる</h3>
    <p>テキストや画像、カードなど、直下に置いた要素がレイアウトの項目になります。</p>
  </article>
  <article class="p0005-demo">
    <h3>03. 用途に合わせて広げる</h3>
    <p>幅や揃え方は標準のFlexプロパティで変更できます。入れ子にも対応しています。</p>
  </article>
  <div class="p0005-layout__full p0005-demo">
    <p>全幅エリア：見出しや補足、アクションなど、1行全体を使う要素に使えます。</p>
  </div>
</div>
