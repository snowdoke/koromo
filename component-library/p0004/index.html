<!-- layout grid -->
<!-- 親の幅に応じて列数が変わる汎用Gridレイアウト。列幅・余白・列構成をCSS変数で調整できます。 -->
<div class="p0004-layout">
  <article class="p0004-demo">
    <h3>01. 幅に合わせて並ぶ</h3>
    <p>要素を追加するだけで、親の幅に収まる列数に自動で調整されます。</p>
  </article>
  <article class="p0004-demo">
    <h3>02. 内容を自由に入れる</h3>
    <p>テキストや画像、カードなど、直下に置いた要素がレイアウトの項目になります。</p>
  </article>
  <article class="p0004-demo">
    <h3>03. 用途に合わせて広げる</h3>
    <p>CSS変数で列幅や余白を変更できます。同じレイアウトの入れ子も可能です。</p>
  </article>
  <div class="p0004-layout__full p0004-demo">
    <p>全幅エリア：見出しや補足、アクションなど、すべての列をまたぐ要素に使えます。</p>
  </div>
</div>
